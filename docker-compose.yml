version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: shopwave-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shopwave-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: